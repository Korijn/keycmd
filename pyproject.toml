[project]
name = "keycmd"
version = "0.7.0"
description = "Safely source your secrets and credentials from the OS keyring"
authors = [{ name = "Korijn van Golen", email = "korijn@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["keyring", "secrets", "credentials", "environment"]
classifiers = ["Typing :: Typed"]
dependencies = [
    "keyring>=25.6",
    "shellingham>=1.5.4",
]

[project.scripts]
keycmd = "keycmd.cli:main"

[project.urls]
Repository = "https://github.com/Korijn/keycmd"

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ty",
]
ruff = ["ruff"]
ty = ["ty"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["keycmd", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff.lint]
select = [
    "E4",
    "E5",
    "E7",
    "E9",
    "F",   # Pyflakes (default)
    "I",   # isort imports
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations
    "T10", # flake8-debugger
    "T20", # flake8-print
    "RUF", # ruff
]

[tool.ruff.lint.per-file-ignores]
# command line tool that reports through print
"keycmd/logs.py" = ["T201"]
# the package is fully annotated, the test suite is not
"tests/*" = ["ANN"]

[tool.ty.src]
include = ["keycmd"]

[tool.ty.rules]
# rules that are off by default, enabled because the package is fully typed
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
# suppressions have to name the rule they suppress, and have to be needed
blanket-ignore-comment = "error"
unused-ignore-comment = "error"

[tool.ty.environment]
# Match the oldest supported Python version (requires-python), so
# that the type checker catches use of newer typing features
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

# example config for development and testing
[tool.keycmd.keys]
ARTIFACTS_TOKEN = { credential = "azure@poetry-repository-main", username = "azure" }

[tool.keycmd.aliases]
ARTIFACTS_TOKEN_B64 = { key = "ARTIFACTS_TOKEN", b64 = true }
